name: Flow Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar TypeScript
        run: npx tsc --noEmit

      - name: Criar pastas necessárias
        run: mkdir -p state output
      
      - name: Rodar testes Jest
        run: npm test

      - name: Rodar teste de acesso externo
        run: npx tsx src/index.ts
        env:
          STATE_PATH: ./state/state.json
          OUTPUT_DIR: ./output

      - name: Upload do resultado do scraper
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-result
          path: output/test-scraper-result.json
          retention-days: 7

      - name: Verificar estrutura
        run: |
          echo "=== Estrutura ==="
          ls -la
          echo ""
          echo "=== src/ ==="
          ls -la src/
          echo ""
          echo "=== tests/ ==="
          ls -la tests/